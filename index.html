<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LAO 워 제네시스</title>
<script src="js/ui_assets.js?v=d1439f92"></script>
<link rel="stylesheet" href="css/ui.css?v=8799fda6">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>

<!-- title -->
<section id="title" class="screen show">
  <div class="title-bg"></div>
  <div class="title-box">
    <img class="logo" id="logo" alt="LAST ORIGIN">
    <div class="logo-en">WAR GENESIS</div>
    <div class="logo-ko">워 제네시스</div>
    <button id="btnStart" class="btn lg">작전 개시</button>
    <div class="touch">TOUCH TO START</div>
  </div>
  <div class="ver" id="ver"></div>
</section>

<!-- lobby: campaign / squad / making -->
<section id="lobby" class="screen">
  <div class="lobby-bg" id="lobbyBg"></div>
  <header class="topbar">
    <button class="back arrow desktop-op-back" id="btnBackDesktop" aria-label="이전 화면" hidden></button>
    <div class="tb-title"><b id="tbEn">CAMPAIGN</b><span id="tbKo">작전 지역</span></div>
    <div class="res">
      <span class="ri parts" title="부품: 제조"><i></i><b id="partsVal">0</b></span>
      <span class="ri tuna" title="참치: 확정 영입"><i></i><b id="tunaVal">0</b></span>
      <span class="ri xp"><i></i><b id="xpVal">0</b></span>
    </div>
    <button class="tbtn help" id="btnHelp" aria-label="도움말">?</button>
    <button class="tbtn opt" id="btnOpt" aria-label="설정"></button>
  </header>

  <!-- operations: mode selection, then chapters -->
  <div id="pOperations" class="pane">
    <div class="op-intro"><span>OPERATION SELECT</span><h2>작전 선택</h2><p>사령관, 참가할 작전을 선택해 주세요.</p></div>
    <div id="operationList" class="operation-list"></div>
  </div>
  <div id="pOperationDetail" class="pane">
    <div class="operation-detail"><div class="op-intro"><span id="opDetailEn"></span><h2 id="opDetailTitle"></h2></div><div id="opDetailBody"></div><div id="opDetailActions" class="pwin-btns"></div></div>
  </div>
  <div id="pChapters" class="pane on">
    <div class="chapters" id="chapterList"></div>
  </div>

  <!-- one chapter: stage path + stage info -->
  <div id="pStages" class="pane">
    <div class="ch-head">
      <div class="ch-no" id="chNo">CHAPTER 01</div>
      <div class="ch-title" id="chTitle"></div>
      <div class="ch-sub" id="chSub"></div>
      <div class="ch-story" id="chStory"></div>
    </div>
    <div class="path" id="stagePath"></div>
    <div class="sinfo" id="stageInfo"></div>
  </div>

  <!-- squad -->
  <div id="pSquad" class="pane">
    <div class="cr-deck">
      <div class="cr-head"><b>덱 구성</b><div class="cr-tabs" id="deckTabs"></div><button class="cr-syn" id="synBtn"></button></div>
      <div id="deckEdit" class="cr-grid"></div>
      <div class="cr-foot"><span class="cr-avg" id="deckAvg"></span><span class="cr-cost" id="deckCount"></span></div>
    </div>
    <div class="cr-sec"><b>보유 대원</b><small>탭: 메뉴 · 드래그: 덱에 넣기 / 빼기</small></div>
    <div class="filter" id="rankFilter"></div>
    <div id="squadList" class="roster cr-roster"></div>
  </div>

  <!-- missions -->
  <div id="pMissions" class="pane"><div class="missions" id="missionList"></div></div>

  <!-- making (gacha) -->
  <div id="pGacha" class="pane">
    <div class="gtabs"><button class="gtab on" data-g="making">제조 <small>부품</small></button><button class="gtab" data-g="shop">확정 영입 <small>참치</small></button></div>
    <div id="gMaking">
    <div class="banner" id="banner">
      <div class="banner-fx"></div>
      <img id="bannerArt" alt="">
      <div class="banner-info">
        <div class="pickup">SPECIAL MAKING · SS 픽업</div>
        <div class="pick-name" id="pickName"></div>
        <div class="pick-desc" id="pickDesc"></div>
        <div class="rates" id="rates"></div>
        <div class="pity" id="pity"></div>
        <div class="pull-btns">
          <button id="pull1" class="btn d">1회 제조<small><i class="parts-i"></i>500</small></button>
          <button id="pull10" class="btn">10회 제조<small><i class="parts-i"></i>5000 · S 이상 확정</small></button>
        </div>
      </div>
    </div>
    <div class="sec-title ss"><b>SS 대원</b><small>제조 · 확정 영입으로만 합류</small></div>
    <div id="ssList" class="roster small"></div>
    </div>
    <div id="gShop" style="display:none">
      <div class="filter" id="shopFilter"></div>
      <div id="shopList" class="roster"></div>
    </div>
  </div>

  <nav class="navbar">
    <button class="nav on" data-pane="campaign"><i class="ni world"></i><span>작전</span></button>
    <button class="nav" data-pane="squad"><i class="ni squad"></i><span>대원</span></button>
    <button class="nav" data-pane="gacha"><i class="ni making"></i><span>제조</span></button>
    <button class="nav" data-pane="missions"><i class="ni medal"></i><span>임무</span><b class="nbadge" id="missionBadge"></b></button>
  </nav>
  <div class="operation-back"><button id="btnBack" class="op-back-btn" aria-label="이전 화면" hidden><i></i><span>뒤로가기</span></button></div>
</section>

<!-- story -->
<section id="story" class="story">
  <div class="st-bg" id="stBg"></div>
  <img class="st-char L" id="stL" alt="">
  <img class="st-char R" id="stR" alt="">
  <button class="st-skip" id="stSkip" aria-label="건너뛰기"></button>
  <div class="st-box" id="stBox">
    <div class="st-name" id="stName"></div>
    <div class="st-text" id="stText"></div>
    <i class="st-arrow"></i>
  </div>
</section>

<section id="credits" class="credits"></section>

<!-- gacha result -->
<section id="gachaResult" class="gres">
  <div class="gres-flash" id="gresFlash"></div>
  <div class="gres-solo" id="gresSolo"><img id="soloArt" alt=""><div class="solo-cap"><i class="rk-i SS"></i><b id="soloName"></b><small id="soloNew"></small></div></div>
  <div class="gres-grid" id="gresGrid"></div>
  <div class="gres-btns"><button id="gresSkip" class="btn d">건너뛰기</button><button id="gresOk" class="btn">확인</button></div>
</section>

<!-- loading -->
<section id="loading" class="screen">
  <div class="load-box">
    <div class="load-code" id="loadCode"></div>
    <div id="loadTitle" class="load-title">작전 준비 중</div>
    <div class="bar"><i id="loadBar"></i></div>
    <div id="loadPct" class="load-pct">0%</div>
  </div>
</section>

<!-- battle HUD -->
<section id="hud" class="screen hud">
  <div id="finale" class="finale"><small>OPERATION COMPLETE</small><b>철의 왕자 격파</b><span>해안에서 시작된 전쟁이 끝났습니다</span></div>
  <div class="hud-top">
    <div class="stage-name"><b id="hudCode"></b><span id="hudStage"></span></div>
    <div class="timer" id="timer">10:00</div>
    <div class="hud-btns">
      <button id="btnSpeed" class="hb speed"><span>x1</span></button>
      <button id="btnPause" class="hb pause" aria-label="일시정지"></button>
    </div>
  </div>
  <div class="hud-bottom">
    <button id="btnWorker" class="side-btn worker">
      <div class="lbl">발전 효율</div>
      <div class="lv">LV <b id="workerLv">1</b></div>
      <div class="cost" id="workerCost">80</div>
    </button>
    <div class="deck-wrap">
      <div class="money power" title="전력: 대원 출격에 사용">
        <div class="pw-head"><i class="pw-ico"></i><b>전력</b></div>
        <div class="pw-num"><span id="money">0</span><small>/<span id="wallet">0</span></small></div>
        <div class="pw-bar"><i id="powerFill"></i></div>
      </div>
      <div class="deck-row">
        <div id="deck" class="deck"></div>
        <button id="btnSwap" class="swap" aria-label="대원 전환"><i>⇄</i><b id="swapPage">1/2</b></button>
      </div>
    </div>
    <button id="btnCannon" class="side-btn cannon">
      <div class="charge" id="cannonFill"></div>
      <div class="lbl">오르카 포격</div>
      <div class="cost" id="cannonTxt">충전 중</div>
    </button>
  </div>
  <div class="banner-layer" id="bannerLayer"></div>
  <div class="cutin" id="cutin"><img id="cutinArt" alt=""><div class="cutin-cap"><i class="rk-i SS"></i><b id="cutinName"></b><span>SKILL</span></div></div>
  <div class="comm" id="comm"><img id="commImg" alt=""><div><b id="commName"></b><span id="commText"></span></div></div>
  <div class="coach" id="coach"><div class="coach-text" id="coachText"></div><i class="coach-arrow" id="coachArrow"></i></div>
</section>

<!-- squad: the card menu (Clash Royale-style), shown under the tapped card -->
<div class="card-menu" id="cardMenu"></div>

<!-- lobby tutorial: a coach bubble over every screen, and a skip button -->
<div class="coach lcoach" id="lcoach"><div class="coach-text" id="lcoachText"></div><i class="coach-arrow" id="lcoachArrow"></i></div>
<button class="tut-skip" id="tutSkip" aria-label="튜토리얼 건너뛰기"><span class="ts-txt"><b>SKIP</b><small>튜토리얼 건너뛰기</small></span><span class="ts-arw"><i></i><i></i></span></button>

<!-- popup -->
<div id="modal" class="modal">
  <div class="pwin">
    <div class="pwin-title"><span id="modalTitle"></span></div>
    <div class="pwin-body" id="modalBody"></div>
    <div id="modalBtns" class="pwin-btns"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/vendor/three.min.js?v=7a7802bf"></script>
<script src="js/assets.js?v=9609a866"></script>
<script src="js/faces.js?v=788d4bb1"></script>
<script src="js/anim_events.js?v=ced1e91b"></script>
<script src="js/data.js?v=6f8ce1d3"></script>
<script src="js/story.js?v=8fb76ffe"></script>
<script src="js/sd.js?v=479027b5"></script>
<script src="js/fxbake.js?v=e9122024"></script>
<script src="js/fx/_meta.js?v=61ee70bc"></script>
<script src="js/audio.js?v=f2275017"></script>
<script src="js/game.js?v=8fe9f2c8"></script>
<script src="js/app.js?v=077df46a"></script>
</body>
</html>
